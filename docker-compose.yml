services:
  app:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: desafiotenis_app
    restart: unless-stopped
    working_dir: /var/www/backend
    volumes:
      - ./backend:/var/www/backend
    networks:
      - desafiotenis
    depends_on:
      - db

  nginx:
    image: nginx:alpine
    container_name: desafiotenis_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
      - "5173:5173"
    volumes:
      - ./backend:/var/www/backend
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./dist:/var/www/frontend
    networks:
      - desafiotenis
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: desafiotenis_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: desafiotenis
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: desafiotenis
      MYSQL_PASSWORD: secret
    ports:
      - "3306:3306"
    volumes:
      - desafiotenis_db:/var/lib/mysql
    networks:
      - desafiotenis

  node:
    image: node:20-alpine
    container_name: desafiotenis_node
    working_dir: /app
    volumes:
      - .:/app
    networks:
      - desafiotenis
    profiles:
      - dev

networks:
  desafiotenis:
    driver: bridge

volumes:
  desafiotenis_db:
